name: turbomon
description: "TurboMon - a top-like system, Wi-Fi and Bluetooth monitor for Android."
publish_to: 'none'

# <semver>+<buildNumber>. The build number is a plain counter -- bump it by one
# for every release, never reuse or lower it. android/app/build.gradle.kts turns
# it into a per-ABI version code of `buildNumber * 10 + abi`, and F-Droid reads
# the changelog under that code (docs/releasing.md).
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - logo-small.png
    # Read at runtime for the About dialog's version (lib/services/app_version.dart),
    # so the version: line above stays the single source of truth.
    - pubspec.yaml

flutter_launcher_icons:
  android: true
  ios: false
  # Generated from the 600x600 render of logo.svg (see docs/building.md).
  image_path: "logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0B2545"
  adaptive_icon_foreground: "icon-foreground.png"
  adaptive_icon_monochrome: "icon-monochrome.png"
